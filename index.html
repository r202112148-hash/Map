<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港電動車綠色智能地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        /*control*/
        .controls { padding: 12px; background: #2c3e50; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn { background: #34495e; color: white; border: none; padding: 8px 16px; margin: 0 4px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background: #1abc9c; }
        .btn.active { background: #1abc9c; font-weight: bold; }
        /*map size*/
        #map { height: calc(100vh - 53px); width: 100%; }
        /*popoutwindow*/
        .popup-route-btn { display: block; text-align: center; background: #27ae60; color: white; padding: 6px; margin-top: 8px; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .popup-route-btn:hover { background: #219653; }
        .badge { display: inline-block; padding: 3px 6px; border-radius: 3px; font-size: 11px; color: white; font-weight: bold; margin-bottom: 5px; }
        .bg-charge { background: #e67e22; }
        .bg-recycle { background: #27ae60; }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn active" id="btn-all" onclick="filterMarkers('all')">顯示全部</button>
        <button class="btn" id="btn-charging" onclick="filterMarkers('charging')">⚡ 充電及泊車</button>
        <button class="btn" id="btn-recycle" onclick="filterMarkers('recycle')">♻️ 電池回收點</button>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // center
        const map = L.map('map').setView([22.2988, 114.1722], 14);
        // OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        let currentMarkers = []; 
        let currentFilter = 'all';
        // databae
        const allLocations = [
            {
                type: 'recycle',
                name: '環保署認可 EV 電池處理中心 (尖沙咀站)',
                lat: 22.3020,
                lng: 114.1750,
                provider: '環境保護署認可專門機構',
                details: '收退役電動車鋰電池、鉛酸電池。<br>開放時間：星期一至五 09:00 - 18:00'
            },
            {
                type: 'recycle',
                name: '綠色汽車循環再造廠 (官塘分店)',
                lat: 22.3125,
                lng: 114.2250,
                provider: '合資格回收商',
                details: '專門處理 EV 動力電池組件。<br>開放時間：星期一至六 10:00 - 19:00'
            },
            {
                type: 'charging',
                name: '尖沙咀海港城停車場 (海運大廈)',
                lat: 22.2951,
                lng: 114.1668,
                provider: '中電 CLP / 停車場直營',
                details: '快充 (60kW) x 2 | 中充 (7kW) x 10<br><b>實時剩餘車位：12 個</b> (每分鐘更新)'
            },
            {
                type: 'charging',
                name: '中間道兒童遊樂場地下停車場',
                lat: 22.2965,
                lng: 114.1740,
                provider: '政府公共充電站 (EPD)',
                details: '標準充電位 x 15<br><b>實時剩餘車位：5 個</b> (每分鐘更新)'
            }
        ];
        // custom marker
const iconRecycle = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});
const iconCharging = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
});
        // marking pins
function renderMarkers() {
    currentMarkers.forEach(marker => map.removeLayer(marker));
    currentMarkers = [];
    allLocations.forEach(loc => {
        if (currentFilter === 'all' || loc.type === currentFilter) {
            const badgeClass = loc.type === 'charging' ? 'bg-charge' : 'bg-recycle';
            const badgeText = loc.type === 'charging' ? '⚡ 充電+泊車' : '♻️ 電池回收';
            // icon color based on the category
            const customIcon = loc.type === 'charging' ? iconCharging : iconRecycle;
            // detect iPhone/iPad _dont know if it will work
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            let mapUrl;
            if (isIOS) {
                //  Apple maps
                mapUrl = `https://maps.apple.com/?daddr=${loc.lat},${loc.lng}`;
            } else {
                //  Google maps
                mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.lat},${loc.lng}`;
            }
            const popupHTML = `
                <span class="badge ${badgeClass}">${badgeText}</span>
                <h3 style="margin:4px 0; font-size:16px;">${loc.name}</h3>
                <p style="margin:2px 0; font-size:12px; color:#7f8c8d;">營運/認可機構: ${loc.provider}</p>
                <div style="margin-top:8px; font-size:13px; line-height:1.4;">${loc.details}</div>
                <a href="${mapUrl}" target="_blank" class="popup-route-btn">🧭 導航</a>
            `;
            // add the custom icon to the marker setting
            const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).bindPopup(popupHTML);
            marker.addTo(map);
            currentMarkers.push(marker); 
        }
    });
}
        // filter of pins
        function filterMarkers(type) {
            currentFilter = type;
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            if(type === 'all') document.getElementById('btn-all').classList.add('active');
            if(type === 'charging') document.getElementById('btn-charging').classList.add('active');
            if(type === 'recycle') document.getElementById('btn-recycle').classList.add('active');
            renderMarkers();
        }
        renderMarkers();
        // real time update

        // function for updating data--looks like
        function fetchLatestData() {
            console.log("正在獲取最新數據...");
        
            // changing parking space
            allLocations.forEach(loc => {
                if (loc.type === 'charging') {
                    // random number
                    const randomVacancy = Math.floor(Math.random() * 16);
                    
                    // update data
                    loc.details = `快充 / 中充設備<br><b style="color: ${randomVacancy === 0 ? 'red' : 'black'}">實時剩餘車位：${randomVacancy} 個</b> (每分鐘更新)`;
                }
            });
        
            // recall function
            renderMarkers();
        }
        
        // timmer--1 minute
        setInterval(fetchLatestData, 60000);
    </script>
</body>
</html>
