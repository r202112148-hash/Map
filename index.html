<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>香港電動車智能地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 80vh; width: 100%; } /* 地圖佔螢幕 80% 高度 */
        .controls { padding: 10px; background: #f0f0f0; text-align: center; }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="filterMarkers('all')">顯示全部</button>
        <button onclick="filterMarkers('charging')">⚡ 充電/泊車</button>
        <button onclick="filterMarkers('recycle')">♻️ 電池回收</button>
    </div>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
